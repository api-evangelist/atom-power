aid: atom-power
name: Atom Power
description: 'Atom Power, Inc. is a Charlotte, North Carolina electrical technology company
  founded in 2014 that invented the Atom Switch, the world''s first commercial UL-listed
  digital solid-state circuit breaker. The company builds SiC (silicon carbide) power
  modules, solid-state switchgear and panel-level Level 2 electric-vehicle charging
  hardware for commercial, industrial, data-center and grid-edge deployments, paired
  with cloud software for energy management, load balancing and charger operations.
  Atom Power previously ran an "Atom Cloud" developer portal on Azure API Management
  at developers.atompower.com with a gateway at api.atompower.com; both hostnames are
  now dangling CNAMEs to deleted Azure API Management instances, so no public API
  contract is currently reachable.'
