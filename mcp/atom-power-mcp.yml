x-note: This is the Wix platform Site MCP endpoint, served from Atom Power's own host (www.atompower.com
  is a Wix-hosted marketing site). It exposes public marketing-site content and the Wix business-solutions
  API surface — it is NOT an Atom Power product API. Atom Power's product API ("Atom Cloud") ran on Azure
  API Management at developers.atompower.com / api.atompower.com; both hostnames now resolve to dangling
  CNAMEs whose Azure API Management targets return NXDOMAIN, so no product-API tool surface exists to
  catalog. Recorded here because the endpoint is genuinely live and returned a real tools/list, not because
  it represents a first-party API program.
