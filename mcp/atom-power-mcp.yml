tools:
- name: ReadFullDocsArticle
  description: Fetches a full Wix docs article or method article with code examples.
  input:
  - articleUrl
- name: ReadFullDocsMethodSchema
  description: Fetches the full schema for a Wix API method before calling it.
  input:
  - articleUrl
  - reason
- name: BrowseWixRESTDocsMenu
  description: Browses the Wix REST documentation menu.
  input:
  - menuUrl
  - reason
- name: CallWixSiteAPI
  description: Calls API methods on the site to act on a visitor's behalf.
  input:
  - visitorToken
  - url
  - method
  - body
- name: GenerateVisitorToken
  description: Creates a visitor session and returns a visitor access token.
  input: []
- name: SearchSiteApiDocs
  description: Retrieves API documentation for the Wix business solutions installed on this site.
  input:
  - searchTerm
- name: GetBusinessDetails
  description: Retrieves business and site details such as timezone, email, phone, address.
  input: []
- name: SearchInSite
  description: Searches the site for information.
  input:
  - searchTerm
- name: ExecuteWixAPI
  description: Executes code against the Wix API surface.
  input:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
